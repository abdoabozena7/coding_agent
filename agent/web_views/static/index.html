<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>GA3BAD Workspace</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar">
      <a class="brand" href="#" aria-label="GA3BAD workspace home">
        <span class="brand-mark" aria-hidden="true">G3</span>
        <span>GA3BAD</span>
      </a>

      <nav id="workspaceNav" class="workspace-nav" aria-label="Workspace">
        <button class="nav-button" data-view="plan" type="button">
          Plan <span class="nav-badge hidden" data-badge="plan"></span>
        </button>
        <button class="nav-button" data-view="review" type="button">
          Review <span class="nav-badge hidden" data-badge="review"></span>
        </button>
        <button class="nav-button" data-view="agents" type="button">
          Execution <span class="nav-badge hidden" data-badge="agents"></span>
        </button>
      </nav>

      <div class="top-actions">
        <div class="mode-toggle" aria-label="Detail level">
          <button id="simpleMode" class="selected" type="button">Simple</button>
          <button id="advancedMode" type="button">Advanced</button>
        </div>
        <button id="refreshButton" class="icon-button" type="button"
                data-help="Reload the latest durable state.">
          <span aria-hidden="true">↻</span><span class="sr-only">Refresh</span>
        </button>
        <span id="connection" class="connection" role="status">
          <i aria-hidden="true"></i><span>Connecting</span>
        </span>
      </div>
    </header>

    <main id="workspace" class="workspace" tabindex="-1">
      <section id="attention" class="attention hidden" aria-labelledby="attentionTitle">
        <div>
          <p id="attentionEyebrow" class="eyebrow"></p>
          <h1 id="attentionTitle"></h1>
          <p id="attentionBody" class="muted"></p>
        </div>
        <button id="attentionAction" class="primary-button hidden" type="button"></button>
      </section>

      <div id="loading" class="state-message">
        <span class="loader" aria-hidden="true"></span>
        <p>Connecting to the local workflow…</p>
      </div>
      <section id="errorState" class="state-message error hidden" role="alert"></section>
      <section id="viewRoot" class="view-root hidden"></section>
    </main>

    <footer class="footer">
      <span id="sessionMeta">Session —</span>
      <span>The harness remains the source of truth.</span>
    </footer>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-modal="true" role="dialog"
         aria-labelledby="drawerTitle">
    <div class="drawer-head">
      <div>
        <p id="drawerEyebrow" class="eyebrow"></p>
        <h2 id="drawerTitle"></h2>
      </div>
      <button id="drawerClose" class="icon-button" type="button" aria-label="Close">×</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
