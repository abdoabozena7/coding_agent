<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>GA3BAD Ultra</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23dca437'/%3E%3Cpath d='M8 9h16v3H11v8h10v-3h-5v-3h8v9H8z' fill='%23141311'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to workspace</a>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar">
      <button id="brand" class="brand" type="button" aria-label="GA3BAD Ultra home">
        <span class="brand-mark" aria-hidden="true">G3</span>
        <span><strong>GA3BAD</strong><small>Ultra workspace</small></span>
      </button>
      <nav class="primary-nav" aria-label="Workspace pages">
        <button data-page="plan" type="button">Plan</button>
        <button data-page="live" type="button">Live</button>
        <a id="outputNav" href="#">Output</a>
      </nav>
      <div class="top-status">
        <button id="modelButton" class="model-chip" type="button" aria-haspopup="dialog" hidden>
          <span>Model</span><strong id="modelName">—</strong>
        </button>
        <span id="connection" class="connection"><i aria-hidden="true"></i><span>Connecting</span></span>
      </div>
    </header>

    <main id="workspace" class="workspace" tabindex="-1">
      <section id="statusStrip" class="status-strip" aria-live="polite">
        <div>
          <span id="statusKicker" class="eyebrow">ULTRA PLAN</span>
          <strong id="statusTitle">Loading saved state…</strong>
        </div>
        <p id="statusDetail">Connecting to the terminal runtime.</p>
        <span id="statusBadge" class="status-badge">Connecting</span>
      </section>

      <section id="blocker" class="blocker hidden" aria-labelledby="blockerTitle">
        <div><span class="eyebrow">ACTION NEEDED</span><h2 id="blockerTitle"></h2><p id="blockerBody"></p></div>
        <div id="blockerActions" class="button-row"></div>
      </section>

      <section id="planPage" class="page" aria-label="Ultra Plan">
        <div id="planRoot" class="page-root"></div>
      </section>

      <section id="livePage" class="page hidden" aria-label="Live workflow">
        <header class="page-heading live-heading">
          <div><span class="eyebrow">READ-ONLY WORKSPACE</span><h1>Live work</h1><p id="liveGoal">The terminal runtime is the source of truth.</p></div>
          <div class="live-meta"><span id="elapsedValue">—</span><small>Elapsed</small></div>
        </header>
        <div class="live-tabs" role="tablist" aria-label="Live sections">
          <button data-live-tab="overview" role="tab" type="button">Overview</button>
          <button data-live-tab="agents" role="tab" type="button">Agents</button>
          <button data-live-tab="timeline" role="tab" type="button">Timeline</button>
        </div>
        <div id="liveRoot" class="page-root"></div>
      </section>

      <div id="loading" class="loading"><span class="spinner" aria-hidden="true"></span><p>Loading the durable workflow…</p></div>
      <section id="fatalError" class="fatal-error hidden" role="alert"></section>
    </main>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header><div><span id="drawerEyebrow" class="eyebrow"></span><h2 id="drawerTitle"></h2></div><button id="drawerClose" class="icon-button" type="button" aria-label="Close">×</button></header>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <script src="/assets/app.js" defer></script>
  <script src="/assets/plan.js" defer></script>
</body>
</html>
