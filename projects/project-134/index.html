<!-- Index HTML file structure -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Calculator</title>
    <!-- Include Three.js library via CDN for visualization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="initializeCalculator()">
    <!-- Container for the 3D visualization -->
    <div id="visualization-container" style="width: 100%; height: 50vh;"></div>
    
    <h1>3D Calculator Interface</h1>
    <div id="calculator-grid">
        <!-- Buttons will be populated or managed by JS/CSS -->
        <button class="calc-button op" data-op="AC">AC</button>
        <button class="calc-button op" data-op="+">+
        <button class="calc-button op" data-op="-">-</button>
        <button class="calc-button op" data-op="*">*</button>
        
        <button class="calc-button num" data-num="7">7</button>
        <button class="calc-button num" data-num="8">8</button>
        <button class="calc-button num" data-num="9">9</button>
        <button class="calc-button op" data-op="/">/</button>

        <button class="calc-button num" data-num="4">4</button>
        <button class="calc-button num" data-num="5">5</button>
        <button class="calc-button num" data-num="6">6</button>
        <button class="calc-button op" data-op="=">=</button>

        <button class="calc-button num" data-num="1">1</button>
        <button class="calc-button num" data-num="2">2</button>
        <button class="calc-button num" data-num="3">3</button>
        <button class="calc-button op" data-op="+">+

        <button class="calc-button num" data-num="0">0</button>
        <button class="calc-button dot" data-dot=".">.</button>
    </div>

    <!-- Import Modules: Scripts must be loaded in the correct order (Engine -> Visualizer -> Controller) -->
    <script src="src/calculatorEngine.js"></script>
    <script src="src/threeDVisualizer.js"></script>
    <script src="src/inputController.js"></script>
</body>
</html>
