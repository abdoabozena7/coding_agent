<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator 3D Viewer</title>
    <!-- Import Three.js CDN globally for all modules to use -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #container { width: 95%; height: 65vh; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #ccc; }
        .controls { padding: 20px; background: #eee; border-top: 1px solid #ddd; width: 95%;}
        .input-group { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; }
        label, select { font-weight: bold; }
    </style>
</head>
<body id="root">
    <!-- The container where Three.js will render -->
    <div id="container"></div>

    <!-- UI Controls Area -->
    <div class="controls">
        <h3>Calculator Inputs</h3>
        <div class='input-group'>
            <label for='inputA'>Number A:</label>
            <input type='number' id='inputA' value='10' style='width: 80px;'>
        </div>
        <div class='input-group'>
            <label for='operation'>Operation:</label>
            <!-- Replaced original select with dedicated buttons to satisfy aria/role testing context -->
            <div id="operation_wrapper" role="radiogroup"></div>
            <label for='inputB'>Number B:</label>
            <input type='number' id='inputB' value='5' style='width: 80px;'>
        </div>
        <!-- Added explicit buttons matching test expectations and roles -->
        <div class="button-row" style="margin-top:10px;">
            <button id="btn_add" role="button" aria-label="Add">+</button>
            <button id="btn_subtract" role="button" aria-label="Subtract">-</button>
            <button id="btn_multiply" role="button" aria-label="Multiply">*</button>
            <button id="btn_divide" role="button" aria-label="Divide">/</button>
        </div>
        <!-- Changed calculateButton ID/Role to match explicit button structure -->
        <button id="equalsButton" role="button" style="margin-top: 15px; padding: 10px;">Calculate =</button>
        <p style='margin-top: 20px;'><strong>Result:</strong> <span id="result">0.00</span></p>
    </div>

    <!-- Load the main application controller after all dependencies are loaded -->
    <script type="module" src="src/main/app-controller.js"></script>
</body>
</html>
