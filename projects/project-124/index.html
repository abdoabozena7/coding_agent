<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Calculator</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="main.js" defer></script>
  <style>
    body { margin:0; overflow:hidden; }
    #renderer { width:100vw; height:100vh; display:block; }
    #ui { position:absolute; top:10px; left:10px; }
    #result { position:absolute; top:10px; right:10px; font-size:24px; color:#fff; }
  </style>
</head>
<body>
  <canvas id="renderer"></canvas>
  <div id="ui"></div>
  <span id="result"></span>
</body>
</html>
