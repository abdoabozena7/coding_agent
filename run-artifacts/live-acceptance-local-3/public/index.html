<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>.error { color: red; }</style>
<script src="https://unpkg.com/react@17/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
<script>
  const CalculatorLogic = {
    add(a, b) { return a + b; },
    subtract(a, b) { return a - b; },
    multiply(a, b) { return a * b; },
    divide(a, b) { return a / b; }
  };

  class CalculatorUI extends React.Component {
    constructor(props) {
      super(props);
      this.state = { result: '', error: false };
    }

    handleClick = (event) => {
      const value = event.target.value;
      if (value === '=') {
        try {
          const [a, b] = this.state.result.split(/\s+/).map(Number);
          this.setState({ result: CalculatorLogic[value](a, b).toString(), error: false });
        } catch (e) {
          this.setState({ result: 'Error', error: true });
        }
      } else if (value === 'C') {
        this.setState({ result: '', error: false });
      } else {
        this.setState(prevState => ({ result: prevState.result + value }));
      }
    }

    render() {
      return (
        <div>
          <input type="text" value={this.state.error ? 'Error' : this.state.result} readOnly />
          {['1', '2', '3', '+', '4', '5', '6', '-', '7', '8', '9', '*', '0', '=', 'C'].map((button, index) => (
            <button key={index} onClick={() => this.handleClick(button)}>{button}</button>
          ))}
        </div>
      );
    }
  }

  ReactDOM.render(<CalculatorUI />, document.getElementById('root'));
</script>
</head>
<body>
<div id="root"></div>
</body>
</html>
