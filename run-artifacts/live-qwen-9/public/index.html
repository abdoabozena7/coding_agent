<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polished Calculator Display</title>
  <style>
    .display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
    }

    .display-input, .display-text {
      margin-top: 20px;
      font-size: 28px;
      border: none;
      outline: none;
      background-color: #fff;
      padding: 15px;
      border-radius: 8px;
    }

    .display-input:focus, .display-text:focus {
      background-color: #eaeaea;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/src/components/DisplayComponent.js"></script>
</body>
</html>
